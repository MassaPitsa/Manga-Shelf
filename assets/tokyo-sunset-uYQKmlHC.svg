<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="duskSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c1b3d"/>
      <stop offset="35%" stop-color="#7a3352"/>
      <stop offset="65%" stop-color="#d9673f"/>
      <stop offset="100%" stop-color="#f4a851"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe0a3"/>
      <stop offset="60%" stop-color="#f8b35c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f8b35c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#duskSky)"/>
  <circle cx="1180" cy="430" r="230" fill="url(#sun)"/>
  <circle cx="1180" cy="430" r="80" fill="#ffedc2" opacity="0.9"/>

  <!-- pajaros -->
  <g stroke="#2a1a22" stroke-width="4" fill="none" opacity="0.6" stroke-linecap="round">
    <path d="M300 200 q14 -14 28 0 q14 -14 28 0"/>
    <path d="M360 240 q12 -12 24 0 q12 -12 24 0"/>
    <path d="M420 190 q10 -10 20 0 q10 -10 20 0"/>
  </g>

  <!-- capa de tejados lejana -->
  <g fill="#4a2b3d" opacity="0.75">
    <rect x="-20" y="560" width="260" height="140"/>
    <rect x="220" y="600" width="200" height="100"/>
    <rect x="400" y="540" width="180" height="160"/>
    <rect x="900" y="580" width="220" height="120"/>
    <rect x="1300" y="560" width="200" height="140"/>
    <rect x="1470" y="600" width="150" height="100"/>
  </g>

  <!-- capa de tejados cercana, mas oscura -->
  <g fill="#2a1620">
    <rect x="-30" y="660" width="300" height="220"/>
    <polygon points="-30,660 120,600 270,660"/>
    <rect x="250" y="700" width="260" height="180"/>
    <polygon points="250,700 380,650 510,700"/>
    <rect x="560" y="680" width="230" height="200"/>
    <rect x="1000" y="690" width="260" height="190"/>
    <polygon points="1000,690 1130,635 1260,690"/>
    <rect x="1280" y="660" width="320" height="220"/>
    <!-- torre estilo tanque de agua -->
    <rect x="700" y="600" width="70" height="80" rx="6"/>
    <polygon points="695,600 775,600 735,560"/>
    <rect x="726" y="540" width="18" height="24"/>
  </g>

  <!-- cables electricos -->
  <g stroke="#1a0f14" stroke-width="3" fill="none" opacity="0.7">
    <path d="M0 640 C 400 700, 800 600, 1600 660"/>
    <path d="M0 660 C 400 720, 800 630, 1600 690"/>
  </g>

  <!-- torre lejana estilo Tokyo Tower -->
  <g fill="#3a1f2c" opacity="0.85">
    <polygon points="1450,880 1480,500 1490,500 1520,880"/>
    <rect x="1455" y="620" width="60" height="10"/>
    <rect x="1465" y="700" width="40" height="8"/>
  </g>
</svg>
