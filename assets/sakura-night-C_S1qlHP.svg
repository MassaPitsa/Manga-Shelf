<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="indigo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1230"/>
      <stop offset="55%" stop-color="#1b1f45"/>
      <stop offset="100%" stop-color="#2c2350"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6df" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#ffe9b0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffe9b0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#indigo)"/>

  <!-- estrellas -->
  <g fill="#f4ead9">
    <circle cx="120" cy="120" r="2"/><circle cx="220" cy="200" r="1.6"/>
    <circle cx="80" cy="300" r="1.8"/><circle cx="340" cy="90" r="1.4"/>
    <circle cx="1500" cy="140" r="2"/><circle cx="1420" cy="240" r="1.6"/>
    <circle cx="1300" cy="80" r="1.4"/><circle cx="1550" cy="320" r="1.8"/>
    <circle cx="700" cy="60" r="1.6"/><circle cx="900" cy="110" r="1.4"/>
    <circle cx="600" cy="180" r="1.8"/><circle cx="1050" cy="60" r="1.4"/>
  </g>

  <!-- luna -->
  <circle cx="1220" cy="220" r="260" fill="url(#moonGlow)"/>
  <circle cx="1220" cy="220" r="92" fill="#fbf3d8"/>
  <circle cx="1195" cy="195" r="14" fill="#efe2ba" opacity="0.6"/>
  <circle cx="1245" cy="245" r="10" fill="#efe2ba" opacity="0.5"/>
  <circle cx="1250" cy="190" r="7" fill="#efe2ba" opacity="0.5"/>

  <!-- silueta de pagoda lejana -->
  <g fill="#151338" opacity="0.9">
    <rect x="140" y="740" width="140" height="140"/>
    <polygon points="110,740 310,740 210,690"/>
    <rect x="180" y="660" width="60" height="34"/>
    <polygon points="160,660 260,660 210,620"/>
    <rect x="200" y="600" width="20" height="26"/>
  </g>

  <!-- rama de sakura -->
  <g stroke="#241a3a" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M1600 40 C 1450 90, 1380 60, 1300 140"/>
    <path d="M1420 75 C 1380 110, 1360 150, 1330 190"/>
    <path d="M1500 55 C 1470 90, 1460 120, 1440 150"/>
  </g>
  <g fill="#f4b8c9">
    <circle cx="1300" cy="140" r="14"/><circle cx="1320" cy="128" r="11"/><circle cx="1285" cy="120" r="10"/>
    <circle cx="1330" cy="190" r="13"/><circle cx="1345" cy="175" r="10"/>
    <circle cx="1440" cy="150" r="12"/><circle cx="1455" cy="165" r="10"/>
    <circle cx="1380" cy="70" r="11"/><circle cx="1400" cy="55" r="9"/>
  </g>
  <!-- petalos cayendo -->
  <g fill="#f4b8c9" opacity="0.85">
    <ellipse cx="1120" cy="260" rx="7" ry="4" transform="rotate(30 1120 260)"/>
    <ellipse cx="980" cy="340" rx="6" ry="3.5" transform="rotate(-20 980 340)"/>
    <ellipse cx="1220" cy="420" rx="7" ry="4" transform="rotate(50 1220 420)"/>
    <ellipse cx="860" cy="220" rx="6" ry="3.5" transform="rotate(10 860 220)"/>
  </g>
</svg>
